<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greeting</title>
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="icon" type="image/svg+xml" href="src/favicon.svg" />
  </head>
  <body>
    <div id="animation-layer" class="animation-layer" aria-hidden="true"></div>

    <main class="page" aria-label="Greeting app">
      <section class="card">
        <label class="label" for="nameInput">Enter Your Name</label>
        <input
          id="nameInput"
          class="input"
          type="text"
          placeholder="Type your name here"
          autocomplete="name"
          inputmode="text"
        />

        <button id="greetBtn" class="button" type="button">Greet</button>

        <div id="greeting" class="greeting" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
